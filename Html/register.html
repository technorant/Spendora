<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page - Spendora</title>

    <link rel="stylesheet" href="css/register.css">


</head>
<body>




    <form action="">


        <legend>Join Us and start your journey today!!</legend>
        <br>



        <label for="fullname">FullName :</label>
        <input type="text"  placeholder="e.g John Doe" id="fullname" required>
        <br><br>



        <label for="email">Email Address :</label>
        <input type="email"  placeholder="e.g abc@gmail.com" id="email" required>
        <br><br>

        
        
        <label for="pwd">Password :</label>
        <input type="password"  placeholder="Type password" id="pwd" required>
        <br><br>


        <label for="yob">Birthday :</label>
        <input type="date" id="yob" required>
        <br><br>


        <label for="dt">Date and Time :</label>
        <input type="datetime-local" id="dt" required>
        <br><br>


        <label for="phone">Phone Number :</label>
        <input type="tel" id="phone" placeholder="e.g 254720247856" required>
        <br><br>


        <label for="file">Upload file :</label>
        <input type="file" id="file" required>
        <br><br>


        <!----DropDown-->



        <!---RadioButton-->



        <!---Checkbox-->
        


        <!---Textarea-->



        <button>Register</button>







    </form>









    
</body>
</html>
